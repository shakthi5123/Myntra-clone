    <title>Myntra Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./utilis.css">
 </head>
 <body>
    <div class="navBar">
        <div class="navLeft">
            <img src="./nav-img/Mlogo.png" alt="" class="mlogo">

                <a href="https://www.myntra.com/checkout/cart" class="cart d-action">Bag</a>

        </div>
